<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Заказ — каталог</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { color-scheme: dark; }
  html,body { background:#0f1115; color:#e7eaf0; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; }
  .safe-b { padding-bottom: calc(env(safe-area-inset-bottom, 0px)); }
  .sheet { transition: transform .25s ease; }
  .sheet.closed { transform: translateY(100%); }
  .fade { animation: fade .18s ease; } @keyframes fade { from {opacity:.4} to {opacity:1} }
  .row:active { background:#1b2029; }
  ::-webkit-scrollbar { width:0; height:0; }
  input { -webkit-user-select:text; user-select:text; }
</style>
</head>
<body class="min-h-screen">


<div class="mx-auto max-w-md min-h-screen flex flex-col">
  <header class="sticky top-0 z-20 bg-[#0f1115]/95 backdrop-blur px-4 pt-3 pb-2 safe-b">
    <div class="flex items-center gap-2">
      <button id="btn-back" class="hidden text-2xl px-1 text-sky-400">←</button>
      <h1 id="hdr-title" class="text-xl font-bold flex-1 truncate">Каталог</h1>
      <span id="hdr-sub" class="text-xs text-slate-400"></span>
    </div>
    <div id="hdr-search" class="mt-2">
      <input id="search" type="search" placeholder="Поиск бренда…" autocomplete="off"
        class="w-full rounded-xl bg-[#1a1f28] px-4 py-2.5 text-[15px] outline-none border border-transparent focus:border-sky-600 placeholder:text-slate-500">
    </div>
  </header>
  <main id="view-brands" class="flex-1 px-3 pb-28 fade"></main>
  <main id="view-flavors" class="hidden flex-1 px-3 pb-28 fade"></main>
  <div id="view-empty" class="hidden flex-1 items-center justify-center text-center text-slate-400 px-8 pb-28">
    <div><div class="text-4xl mb-3">📦</div>Каталог не загрузился</div>
  </div>
  <div class="fixed bottom-0 inset-x-0 z-30 mx-auto max-w-md px-3 pb-3 safe-b">
    <button id="cart-bar" class="w-full rounded-2xl bg-[#1a2230] border border-[#2b3a55] px-4 py-3 flex items-center gap-3 text-left shadow-lg">
      <span class="text-xl">🛒</span>
      <span class="flex-1"><span class="block font-semibold">Корзина</span>
      <span id="cart-sum" class="block text-xs text-slate-400">пусто</span></span>
      <span id="cart-count" class="hidden min-w-[26px] h-[26px] px-1.5 rounded-full bg-sky-600 text-white text-xs font-bold grid place-items-center"></span>
      <span class="text-slate-400" id="cart-chev">▴</span>
    </button>
  </div>
  <div id="sheet" class="sheet closed fixed inset-x-0 bottom-0 z-40 mx-auto max-w-md rounded-t-3xl bg-[#151a23] border-t border-[#2b3a55] px-4 pt-3 safe-b" style="max-height:72vh">
    <div class="flex items-center justify-between">
      <h2 class="font-bold text-lg">Корзина</h2>
      <div class="flex gap-3 text-sm">
        <button id="btn-clear" class="text-rose-400">Очистить</button>
        <button id="btn-close" class="text-slate-400 px-1">✕</button>
      </div>
    </div>
    <div id="cart-items" class="overflow-y-auto my-2 space-y-1" style="max-height:38vh"></div>
    <button id="btn-submit" class="w-full rounded-2xl bg-sky-600 active:bg-sky-700 py-3.5 font-bold text-[16px] mb-1">Оформить</button>
  </div>
  <div id="scrim" class="hidden fixed inset-0" style="z-index:35;background:rgba(0,0,0,.5)"></div>
  <div id="done" class="hidden fixed inset-0 z-50 bg-black/70 grid place-items-center p-6">
    <div class="w-full max-w-sm rounded-3xl bg-[#161c27] border border-[#2b3a55] p-5 fade">
      <div class="text-3xl mb-2">✅</div>
      <h3 class="font-bold text-lg mb-1">Отправь заказ боту</h3>
      <p class="text-sm text-slate-400 mb-1">Открылся чат с готовым сообщением — нажми «Отправить». Если не открылся — скопируй текст:</p>
      <pre id="done-text" class="text-[13px] bg-[#0f131b] rounded-xl p-3 my-3 whitespace-pre-wrap"></pre>
      <div class="flex gap-2">
        <button id="btn-copy" class="flex-1 rounded-xl bg-[#243044] py-2.5 text-sm font-semibold">Скопировать</button>
        <button id="btn-ok" class="flex-1 rounded-xl bg-sky-600 py-2.5 text-sm font-semibold">Готово</button>
      </div>
    </div>
  </div>
</div>
<script>
window.addEventListener('error', e => {
  const el = document.getElementById('view-empty');
  if (el && !document.querySelector('#view-brands button')) {
    el.classList.remove('hidden'); el.classList.add('flex');
    el.innerHTML = '<div><div class="text-3xl mb-2">⚠️</div>Ошибка: ' + (e.message || 'загрузка не удалась') + '</div>';
  }
});
</script>
<script>
// ======= НАСТРОЙКА: username твоего бота (без @) =======
const BOT_USERNAME = "sigi_bugri_bot";   // <-- твой бот
// ========================================================

(() => {
  const tg = window.Telegram && Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#0f1115'); tg.setBackgroundColor('#0f1115'); } catch(e){} }
  const haptic = t => { try { tg.HapticFeedback.notification(t); } catch(e){} };
  const impact = () => { try { tg.HapticFeedback.impactOccurred('light'); } catch(e){} };
  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  let catalog = {}, brand = null, cart = {};
  try { cart = JSON.parse(localStorage.getItem('zakaz_cart_v3') || '{}'); } catch(e){}

  const key = (b,f) => b + '\u0000' + f;
  const parts = k => { const i = k.indexOf('\u0000'); return [k.slice(0,i), k.slice(i+1)]; };
  const save = () => localStorage.setItem('zakaz_cart_v3', JSON.stringify(cart));
  const cartQty = () => Object.values(cart).reduce((s,q)=>s+q,0);
  const brandQty = b => Object.entries(cart).reduce((s,[k,q]) => s + (parts(k)[0]===b ? q:0), 0);
  const fqty = (b,f) => cart[key(b,f)] || 0;

  const COLORS = ['38bdf8','818cf8','f472b6','fb923c','a3e635','2dd4bf','facc15','f87171'];
  const hue = s => { let h=0; for (const c of s) h=(h*31+c.codePointAt(0))%997; return COLORS[h%COLORS.length]; };
  const normBrand = {};   // casefold -> отображаемое имя

  // парсер inventory.txt — правила как на бэкенде: рез по первой '|',
  // вкусы через запятую, дубли по регистру склеиваем
  function parse(text) {
    const brands = {}, flavors = {};
    for (let line of text.split('\n')) {
      line = line.trim();
      const i = line.indexOf('|');
      if (i < 0) continue;
      let b = line.slice(0,i).trim(); if (!b) continue;
      const bk = b.toLowerCase();
      if (!(bk in brands)) { brands[bk] = b; flavors[bk] = {}; }
      for (let chunk of line.slice(i+1).split(',')) {
        chunk = chunk.trim(); if (!chunk) continue;
        const fk = chunk.toLowerCase();
        if (!(fk in flavors[bk])) flavors[bk][fk] = chunk;
      }
    }
    const out = {};
    Object.keys(brands).sort().forEach(bk => {
      const list = Object.values(flavors[bk]).sort((a,b)=>a.localeCompare(b,'ru'));
      if (list.length) out[brands[bk]] = list;
    });
    return out;
  }

  function setQty(b,f,d) {
    const k = key(b,f), nv = (cart[k]||0) + d;
    if (nv <= 0) delete cart[k]; else cart[k] = nv;
    save(); impact(); render();
  }

  function render() {
    const q = $('search').value.trim().toLowerCase();
    const brands = Object.keys(catalog).sort((a,b)=>a.localeCompare(b,'ru'));
    if (!brands.length) {
      $('view-brands').classList.add('hidden'); $('view-flavors').classList.add('hidden');
      $('view-empty').classList.remove('hidden'); $('view-empty').classList.add('flex');
      updateBar(); return;
    }
    $('view-empty').classList.add('hidden'); $('view-empty').classList.remove('flex');
    if (!brand) {
      $('hdr-title').textContent = 'Каталог';
      $('hdr-sub').textContent = brands.length + ' брендов';
      $('btn-back').classList.add('hidden'); $('hdr-search').classList.remove('hidden');
      $('view-flavors').classList.add('hidden');
      const v = $('view-brands'); v.classList.remove('hidden');
      v.innerHTML = brands.filter(b => !q || b.toLowerCase().includes(q)).map(b => {
        const cnt = catalog[b].length, cb = brandQty(b);
        return `<button class="row w-full mt-2 rounded-2xl bg-[#171c25] border border-[#232b39] px-3 py-3 flex items-center gap-3" data-b="${esc(b)}">
          <span class="w-10 h-10 shrink-0 rounded-xl grid place-items-center font-bold text-[#0f1115]" style="background:#${hue(b)}">${esc(b[0].toUpperCase())}</span>
          <span class="flex-1 min-w-0"><span class="block font-semibold truncate">${esc(b)}</span>
          <span class="block text-xs text-slate-400">вкусов: ${cnt}</span></span>
          ${cb ? `<span class="min-w-[26px] h-[26px] px-1.5 rounded-full bg-sky-600 text-xs font-bold grid place-items-center">${cb}</span>` : ''}
          <span class="text-slate-500">›</span></button>`;
      }).join('') || '<p class="text-center text-slate-500 mt-10">Ничего не найдено</p>';
      v.querySelectorAll('[data-b]').forEach(el => el.onclick = () => { brand = el.dataset.b; impact(); render(); });
    } else {
      $('hdr-title').textContent = brand;
      $('hdr-sub').textContent = catalog[brand].length + ' вкусов';
      $('btn-back').classList.remove('hidden'); $('hdr-search').classList.add('hidden');
      $('view-brands').classList.add('hidden');
      const v = $('view-flavors'); v.classList.remove('hidden');
      v.innerHTML = (catalog[brand]||[]).map(f => {
        const n = fqty(brand,f);
        return `<div class="mt-2 rounded-2xl bg-[#171c25] border border-[#232b39] px-3 py-3 flex items-center gap-3">
          <span class="flex-1 min-w-0 text-[15px] ${f==='Неизвестно'?'text-amber-400 italic':''}">${esc(f)}</span>
          ${n ? `<div class="flex items-center gap-1">
              <button class="w-9 h-9 rounded-xl bg-[#243044] text-lg font-bold" data-m="${esc(f)}">−</button>
              <span class="w-7 text-center font-bold">${n}</span>
              <button class="w-9 h-9 rounded-xl bg-sky-600 text-lg font-bold" data-p="${esc(f)}">+</button></div>`
          : `<button class="w-9 h-9 rounded-xl bg-[#243044] text-lg font-bold text-sky-400" data-p="${esc(f)}">+</button>`}
        </div>`;
      }).join('');
      v.querySelectorAll('[data-p]').forEach(el => el.onclick = () => setQty(brand, el.dataset.p, +1));
      v.querySelectorAll('[data-m]').forEach(el => el.onclick = () => setQty(brand, el.dataset.m, -1));
    }
    updateBar();
    if (sheetOpen) renderSheet();
  }

  let sheetOpen = false;
  function updateBar() {
    const n = cartQty();
    $('cart-count').classList.toggle('hidden', !n);
    $('cart-count').textContent = n;
    $('cart-sum').textContent = n ? `${n} шт · ${Object.keys(cart).length} поз.` : 'пусто';
    $('btn-submit').disabled = !n; $('btn-submit').classList.toggle('opacity-40', !n);
  }
  function renderSheet() {
    const items = Object.entries(cart).sort((a,b)=>parts(a[0]).join(' ').localeCompare(parts(b[0]).join(' '),'ru'));
    $('cart-items').innerHTML = items.length ? items.map(([k,q]) => {
      const [b,f] = parts(k);
      return `<div class="flex items-center gap-2 rounded-xl bg-[#1b212c] px-3 py-2">
        <span class="flex-1 min-w-0"><span class="block text-sm font-semibold truncate">${esc(b)}</span>
        <span class="block text-xs text-slate-400 truncate">${esc(f)}</span></span>
        <button class="w-8 h-8 rounded-lg bg-[#243044] font-bold" data-m2="${esc(k)}">−</button>
        <span class="w-6 text-center font-bold">${q}</span>
        <button class="w-8 h-8 rounded-lg bg-sky-600 font-bold" data-p2="${esc(k)}">+</button></div>`;
    }).join('') : '<p class="text-center text-slate-500 py-6">Пусто. Добавьте вкусы из каталога.</p>';
    $('cart-items').querySelectorAll('[data-p2]').forEach(el => el.onclick = () => { const [b,f]=parts(el.dataset.p2); setQty(b,f,+1); });
    $('cart-items').querySelectorAll('[data-m2]').forEach(el => el.onclick = () => { const [b,f]=parts(el.dataset.m2); setQty(b,f,-1); });
  }
  function openSheet(o) {
    sheetOpen = o;
    $('sheet').classList.toggle('closed', !o);
    $('scrim').classList.toggle('hidden', !o);
    $('cart-chev').textContent = o ? '▾' : '▴';
    if (o) renderSheet();
  }
  $('cart-bar').onclick = () => openSheet(!sheetOpen);
  $('btn-close').onclick = () => openSheet(false);
  $('scrim').onclick = () => openSheet(false);
  $('btn-clear').onclick = () => { cart = {}; save(); impact(); render(); };
  $('btn-back').onclick = () => { brand = null; impact(); render(); };
  $('search').oninput = render;

  // оформление: текст заказа -> предзаполненное сообщение боту
  $('btn-submit').onclick = () => {
    const items = Object.entries(cart).map(([k,q]) => { const [b,f]=parts(k); return {b,f,q}; });
    if (!items.length) return;
    const name = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user)
      ? (tg.initDataUnsafe.user.first_name || '') : '';
    const text = 'Заказ' + (name ? ' — ' + name : '') + '\n' +
      items.map(i => `${i.b} — ${i.f} ×${i.q}`).join('\n') + '\nИтого: ' + cartQty() + ' шт';
    cart = {}; save(); openSheet(false); render();
    $('done-text').textContent = text;
    $('done').classList.remove('hidden');
    haptic('success');
    // пробуем открыть чат бота с предзаполненным текстом
    const link = `https://t.me/${BOT_USERNAME}?text=${encodeURIComponent(text)}`;
    try { (tg ? tg.openTelegramLink(link) : window.open(link, '_blank')); } catch(e){}
    try { navigator.clipboard.writeText(text); } catch(e){}
  };
  $('btn-copy').onclick = async () => {
    try { await navigator.clipboard.writeText($('done-text').textContent); $('btn-copy').textContent = 'Скопировано ✓'; } catch(e){}
    setTimeout(()=>{ $('btn-copy').textContent = 'Скопировать'; }, 1500);
  };
  $('btn-ok').onclick = () => $('done').classList.add('hidden');

  // загрузка каталога из репозитория
  async function loadCatalog() {
    try {
      const r = await fetch('./inventory.txt?_=' + Date.now(), { cache: 'no-store' });
      catalog = parse(await r.text());
      if (brand && !catalog[brand]) brand = null;
    } catch(e) { catalog = {}; }
    render();
  }
  loadCatalog();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadCatalog(); });
})();
</script>
</body>
</html>
